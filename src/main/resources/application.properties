# Main settings for the VeloVerse Spring Boot application.
# Each line is key=value. Spring Boot reads this file automatically at start-up.

# The name of the application (used, for example, in log messages).
spring.application.name=veloverse

# PostgreSQL connection for local development
# url: the JDBC address of the database (server localhost, port 5432, database "veloverse").
spring.datasource.url=jdbc:postgresql://localhost:5432/veloverse
# username: the PostgreSQL user the application logs in as.
spring.datasource.username=postgres
# The password is read from the DB_PASSWORD environment variable.
# Never write the real password in this file.
spring.datasource.password=${DB_PASSWORD}

# Hibernate must not create or change tables.
# The schema is defined explicitly in schema.sql and the starter content in data.sql.
spring.jpa.hibernate.ddl-auto=none

# Run schema.sql and data.sql on every start-up. Both scripts are safe to re-run:
# tables are only created if missing and existing rows are never duplicated or overwritten.
spring.sql.init.mode=always

# Database access happens in services, not while the page is rendering.
# (open-in-view=false closes the database session when the controller finishes, so all data
# a page needs must already be loaded by the service.)
spring.jpa.open-in-view=false
