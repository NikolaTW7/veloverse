<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Spring Boot shows this page automatically for any "not found" response -->

<body>

<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="section">
    <div class="container narrow text-center">
        <p class="eyebrow eyebrow-accent">Error 404</p>
        <h1 class="section-title">Page not found</h1>
        <p class="lead centred">The page you were looking for does not exist or may have been moved.</p>
        <div class="button-row centred-row">
            <a class="btn btn-dark" th:href="@{/}">Back to Home</a>
            <a class="btn btn-outline" th:href="@{/bicycle-types}">Browse Bicycle Types</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
