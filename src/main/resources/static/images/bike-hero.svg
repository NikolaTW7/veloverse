<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Original line illustration drawn for VeloVerse (vector code, not a photograph).
       A generic road bicycle with no brand marks. Decorative: used with alt="". -->
  <defs>
    <linearGradient id="frame" x1="400" y1="300" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8a8a93"/>
    </linearGradient>
    <radialGradient id="floor" cx="800" cy="900" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8f031" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c8f031" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="760" cy="640" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8f031" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8f031" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Light on the floor and a faint horizon line -->
  <ellipse cx="800" cy="905" rx="640" ry="70" fill="url(#floor)"/>
  <line x1="60" y1="905" x2="1540" y2="905" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Rear wheel -->
  <g>
    <circle cx="430" cy="650" r="252" stroke="#26262b" stroke-width="26"/>
    <circle cx="430" cy="650" r="236" stroke="#d4d4d8" stroke-opacity="0.85" stroke-width="5"/>
    <circle cx="430" cy="650" r="214" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5">
      <line x1="430" y1="650" x2="430" y2="414"/><line x1="430" y1="650" x2="548" y2="446"/>
      <line x1="430" y1="650" x2="634" y2="532"/><line x1="430" y1="650" x2="666" y2="650"/>
      <line x1="430" y1="650" x2="634" y2="768"/><line x1="430" y1="650" x2="548" y2="854"/>
      <line x1="430" y1="650" x2="430" y2="886"/><line x1="430" y1="650" x2="312" y2="854"/>
      <line x1="430" y1="650" x2="226" y2="768"/><line x1="430" y1="650" x2="194" y2="650"/>
      <line x1="430" y1="650" x2="226" y2="532"/><line x1="430" y1="650" x2="312" y2="446"/>
    </g>
    <circle cx="430" cy="650" r="34" stroke="#a1a1aa" stroke-width="6"/>
    <circle cx="430" cy="650" r="12" fill="#a1a1aa"/>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="1180" cy="650" r="252" stroke="#26262b" stroke-width="26"/>
    <circle cx="1180" cy="650" r="236" stroke="#d4d4d8" stroke-opacity="0.85" stroke-width="5"/>
    <circle cx="1180" cy="650" r="214" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5">
      <line x1="1180" y1="650" x2="1180" y2="414"/><line x1="1180" y1="650" x2="1298" y2="446"/>
      <line x1="1180" y1="650" x2="1384" y2="532"/><line x1="1180" y1="650" x2="1416" y2="650"/>
      <line x1="1180" y1="650" x2="1384" y2="768"/><line x1="1180" y1="650" x2="1298" y2="854"/>
      <line x1="1180" y1="650" x2="1180" y2="886"/><line x1="1180" y1="650" x2="1062" y2="854"/>
      <line x1="1180" y1="650" x2="976" y2="768"/><line x1="1180" y1="650" x2="944" y2="650"/>
      <line x1="1180" y1="650" x2="976" y2="532"/><line x1="1180" y1="650" x2="1062" y2="446"/>
    </g>
    <circle cx="1180" cy="650" r="16" fill="#a1a1aa"/>
  </g>

  <!-- Drivetrain: chain, cassette and chainring in lime -->
  <circle cx="760" cy="660" r="140" fill="url(#glow)"/>
  <path d="M430 618 L760 588 M430 682 L760 732" stroke="#c8f031" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="760" cy="660" r="72" stroke="#c8f031" stroke-width="8"/>
  <circle cx="760" cy="660" r="56" stroke="#c8f031" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="6 8"/>
  <circle cx="760" cy="660" r="16" fill="#c8f031"/>
  <path d="M760 660 L812 776" stroke="#d4d4d8" stroke-width="14" stroke-linecap="round"/>
  <rect x="790" y="770" width="54" height="14" rx="6" fill="#d4d4d8"/>

  <!-- Frame -->
  <g stroke="url(#frame)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760 660 L668 336"/>                 <!-- seat tube -->
    <path d="M668 336 L1060 352"/>                <!-- top tube -->
    <path d="M760 660 L1076 432"/>                <!-- down tube -->
    <path d="M1060 352 L1076 432"/>               <!-- head tube -->
    <path d="M760 660 L430 650"/>                 <!-- chainstay -->
    <path d="M668 336 L430 650"/>                 <!-- seatstay -->
  </g>
  <!-- Fork -->
  <path d="M1076 432 C1110 520 1150 590 1180 650" stroke="#d4d4d8" stroke-width="14" stroke-linecap="round"/>

  <!-- Seatpost and saddle -->
  <path d="M668 336 L650 272" stroke="#a1a1aa" stroke-width="12" stroke-linecap="round"/>
  <path d="M570 262 C610 250 690 248 742 262 C700 274 620 276 570 262 Z" fill="#e4e4e7"/>

  <!-- Stem and drop handlebar -->
  <path d="M1060 352 L1052 312 L1130 300" stroke="#d4d4d8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1130 300 C1180 296 1196 336 1180 372 C1168 398 1140 404 1124 396" stroke="#e4e4e7" stroke-width="12" stroke-linecap="round"/>
  <path d="M1134 304 L1150 344" stroke="#a1a1aa" stroke-width="10" stroke-linecap="round"/>

  <!-- Brake calipers -->
  <path d="M1176 404 L1192 418" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round"/>
</svg>
