# Settings used ONLY by the automated tests (this file is on the test classpath only).
# Spring Boot reads config/application.properties after the normal application.properties,
# so the lines below replace the matching lines from src/main/resources/application.properties
# while `mvnw test` runs. Everything else (user name, DB_PASSWORD, ...) stays the same.

# The tests use their own database, so they never read or change the website's data
# in "veloverse" and do not depend on which update scripts have been run there.
# Create it once with:  createdb -U postgres veloverse_test
spring.datasource.url=jdbc:postgresql://localhost:5432/veloverse_test

# Before schema.sql runs, test-reset.sql empties the test database, so every test run
# starts from exactly what schema.sql and data.sql create.
spring.sql.init.schema-locations=classpath:test-reset.sql,classpath:schema.sql
